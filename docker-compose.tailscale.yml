services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: student-planner
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - tailscale_state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: sh -c "tailscaled & sleep 2 && tailscale up --authkey=$${TS_AUTHKEY} --hostname=student-planner && tailscale serve --bg 8000 && wait"
  planner:
    network_mode: service:tailscale
    depends_on:
      - tailscale
      - db
    ports: []
volumes:
  tailscale_state:
