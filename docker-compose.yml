services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-student_planner}
      POSTGRES_USER: ${POSTGRES_USER:-planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d student_planner"]
      interval: 5s
      timeout: 5s
      retries: 10
  planner:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-planner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-student_planner}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
volumes:
  postgres_data:
