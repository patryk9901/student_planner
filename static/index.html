<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planer Studenta</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/styles.css"></head><body>
<section id="authView" class="auth-view"><button class="icon-btn auth-theme" id="authThemeBtn" data-theme-button aria-label="Przełącz dark mode">☾</button><div class="auth-copy"><div class="auth-brand"><img class="logo-image auth-logo" src="/static/logo.png" alt="Planer Studenta"><strong>Planer Studenta</strong></div><div class="eyebrow">TWÓJ OSOBISTY PLANNER</div><h1>Zaplanuj semestr.<br><em>Miej wszystko pod kontrolą.</em></h1><p>Planuj przedmioty, terminy i postęp w jednym miejscu.</p></div><div class="auth-card"><div class="auth-tabs"><button class="auth-tab active" data-auth="login">Zaloguj się</button><button class="auth-tab" data-auth="register">Zarejestruj się</button></div><div id="authError" class="auth-error"></div><form id="loginForm" class="auth-form"><label>Login<input name="login" required autocomplete="username"></label><label>Hasło<input type="password" name="password" required autocomplete="current-password"></label><button class="primary">Zaloguj się</button></form><form id="registerForm" class="auth-form hidden"><label>Login<input name="login" required minlength="3" autocomplete="username"></label><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Hasło<input type="password" name="password" required minlength="6" autocomplete="new-password"></label><button class="primary">Utwórz konto</button></form></div></section>
<div id="plannerView" class="app-shell hidden"><aside class="sidebar"><div class="brand"><img class="logo-image" src="/static/logo.png" alt="Student Planner"><div><strong>Planer Studenta</strong><span>Semestr pod kontrolą</span></div></div><nav><button class="nav-item active" data-view="dashboard"><span>◫</span> Przegląd</button><button class="nav-item" data-view="stats"><span>◒</span> Statystyki</button></nav><div class="sidebar-bottom"><div class="user"><div class="avatar">ST</div><div><b id="userLogin">Student</b><small id="userEmail">moje konto</small></div><button id="logoutBtn" class="logout">Wyloguj</button></div></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">TWÓJ PRYWATNY PLANNER</div><h1 id="page-title">Witaj, Studencie <span>✦</span></h1></div><div class="top-actions"><button class="icon-btn" id="themeBtn" data-theme-button>☾</button><button class="primary" id="quickAdd">＋ Dodaj wydarzenie</button></div></header><div id="app"></div></main></div><div id="modal-root"></div><script src="/static/app.js"></script></body></html>
